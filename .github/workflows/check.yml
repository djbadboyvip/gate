name: VPN Gate Node Check

on:
  schedule:
    - cron: '0 */10 * * *'    # 每 10 小时整点运行一次（UTC 时间）
  workflow_dispatch:           # 保持支持手动触发
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        id: check
        run: python vpngate.py
        env:
          # 使用 GitHub Secrets 保护真实域名，公开仓库也不会泄露
          CHECK_WORKER: "https://${{ secrets.DOMAIN }}/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://djbadboyvip.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'

      # TG 通知: 检测成功/失败都发 (if: always), 数字从脚本生成的 public/data.json 里读,
      # 不用改 vpngate.py. Secret 没配好时只打印警告, 不会把整个 workflow 搞失败.
      # 需要在仓库 Settings -> Secrets and variables -> Actions 里加好:
      #   TG_BOT_TOKEN (BotFather 给的 token) 和 TG_CHAT_ID (收消息的聊天 ID)
      - name: Send Telegram notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          python - <<'PYEOF'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("TG_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TG_CHAT_ID", "").strip()
          check_outcome = os.environ.get("CHECK_OUTCOME", "")
          deploy_outcome = os.environ.get("DEPLOY_OUTCOME", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          site = "https://djbadboyvip.github.io/gate/"

          if not token or not chat_id:
              print("Telegram 通知跳过: TG_BOT_TOKEN 或 TG_CHAT_ID 没配 (仓库 Secrets 里加好再跑)")
              raise SystemExit(0)

          stats = {}
          countries = {}
          try:
              with open("public/data.json", encoding="utf-8") as f:
                  data = json.load(f)
                  stats = data.get("stats", {}) or {}
                  countries = data.get("countries", {}) or {}
          except Exception as exc:
              print(f"读 public/data.json 失败: {exc}")

          raw_nodes = stats.get("raw_nodes", "?")
          sstp_nodes = stats.get("sstp_nodes", "?")
          valid_nodes = stats.get("success", "?")
          country_count = stats.get("countries", "?")
          residential = stats.get("residential_est", "?")

          # 国家列表：只要简码，不要数量，按可用节点数倒序
          country_list = "未知"
          try:
              counts = []
              for entry in countries.values():
                  code = str(entry.get("code", "")).strip().lower()
                  n = len(entry.get("nodes", []))
                  if code and n:
                      counts.append((n, code))
              counts.sort(key=lambda x: (-x[0], x[1]))
              if counts:
                  country_list = " ".join(code for _, code in counts)
          except Exception as exc:
              print(f"统计国家列表失败: {exc}")

          if check_outcome != "success":
              title = "❌ *VPN Gate 节点检测失败！*"
              body = (
                  f"📥 获取原始节点: `{raw_nodes}`\n"
                  f"🔧 SSTP 节点: `{sstp_nodes}`\n"
                  "──────────────────────\n"
                  "🔍 请检查 GitHub Actions 运行日志。"
              )
          elif deploy_outcome != "success":
              title = "⚠️ *VPN Gate 检测成功，部署失败！*"
              body = (
                  f"📥 获取原始节点: `{raw_nodes}`\n"
                  f"🔧 SSTP 节点: `{sstp_nodes}`\n"
                  f"🟢 可用节点: `{valid_nodes}`\n"
                  f"🌍 国家数量: `{country_count}`\n"
                  f"🗺️ 国家列表: `{country_list}`\n"
                  "──────────────────────\n"
                  "🔍 部署步骤失败，请检查 GitHub Actions 运行日志。"
              )
          else:
              title = "✅ *VPN Gate 节点检测与部署成功！*"
              body = (
                  f"📥 获取原始节点: `{raw_nodes}`\n"
                  f"🔧 SSTP 节点: `{sstp_nodes}`\n"
                  f"🟢 可用节点: `{valid_nodes}`\n"
                  f"🏠 住宅节点: `{residential}`\n"
                  f"🌍 国家数量: `{country_count}`\n"
                  f"🗺️ 国家列表: `{country_list}`\n"
                  "──────────────────────\n"
                  f"🌍 平台: [{repo}]({site})\n"
                  f"🌐 访问地址: [点击查看在线页面]({site})"
              )

          message = title + "\n──────────────────────\n" + body
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "Markdown",
              "disable_web_page_preview": "true",
          }).encode("utf-8")
          try:
              req = urllib.request.Request(url, data=data, method="POST")
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("Telegram 通知发送成功:", resp.read().decode("utf-8"))
          except Exception as exc:
              print("发送 Telegram 失败:", exc)
          PYEOF
